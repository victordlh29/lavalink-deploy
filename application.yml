# Lavalink v4.2.2 Configuration for Render.com
# Docs: https://lavalink.dev/configuration.html
# Plugin config: https://github.com/lavalink-devs/youtube-source
#
# IMPORTANTE: la config de plugins va en el NIVEL RAIZ (`plugins:`),
# NO dentro de `lavalink:` (ahi se ignora silenciosamente).

server:
  port: ${SERVER_PORT:10000}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}

    # Built-in YouTube source deprecated: se usa el plugin de abajo
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true

    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 30
    isTrace: false

    statsUpdateInterval: 60
    gcInterval: 120

  # Dependencias de plugins (auto-descarga)
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

# Config del plugin YouTube (nivel raiz)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Orden de clientes al cargar/reproducir.
    # TVHTML5_SIMPLY y ANDROID_VR son los que menos bloquea YouTube desde IPs de datacenter.
    clients:
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - MUSIC
      - WEB
    # OAuth: evita el "This video requires login" (LOGIN_REQUIRED).
    # En el primer arranque, los logs de Render muestran un codigo para
    # https://www.google.com/device — autorizalo con una cuenta BURNER (no la principal).
    # Tras autorizar, pega el refreshToken impreso en logs y pon skipInitialization: true.
    oauth:
      enabled: true
      skipInitialization: false
      # refreshToken: ""

# Spring Boot actuator (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
