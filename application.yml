# Lavalink v4.2.2 Configuration for Render.com
# Docs: https://lavalink.dev/configuration.html
# Plugin config: https://github.com/lavalink-devs/youtube-source
#
# IMPORTANTE: la config de plugins va en el NIVEL RAIZ (`plugins:`),
# NO dentro de `lavalink:` (ahi se ignora silenciosamente).

server:
  port: ${SERVER_PORT:10000}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}

    # Built-in YouTube source deprecated: se usa el plugin de abajo
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true

    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 30
    isTrace: false

    statsUpdateInterval: 60
    gcInterval: 120

  # Dependencias de plugins (auto-descarga)
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

# Config del plugin YouTube (nivel raiz)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Orden de clientes al cargar/reproducir.
    # TV es el UNICO cliente OAuth-compatible (tabla oficial del plugin): sin el,
    # el token no se usa y YouTube sigue pidiendo login desde IPs de datacenter.
    # Va al final porque solo aporta reproduccion (sin busqueda ni metadatos).
    clients:
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - MUSIC
      - WEB
      - TV
    # OAuth: evita el "This video requires login" (LOGIN_REQUIRED).
    # El refreshToken NUNCA va escrito aqui (repo publico): se setea como variable
    # de entorno YT_REFRESH_TOKEN en el panel de Render y Spring la resuelve.
    # Para generarlo: skipInitialization false -> arrancar -> codigo en google.com/device
    # (cuenta BURNER) -> copiar el refresh token de los logs -> crear la env var en Render.
    oauth:
      enabled: true
      skipInitialization: true
      refreshToken: "${YT_REFRESH_TOKEN:}"

# Spring Boot actuator (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
