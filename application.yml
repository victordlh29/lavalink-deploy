# Lavalink v4.2.2 Configuration for Render.com
# Docs: https://lavalink.dev/configuration.html
#
# Render assigns a port via the PORT environment variable.
# Spring Boot reads SERVER_PORT to set the listening port.
# We set SERVER_PORT in Dockerfile to match Render's PORT.

server:
  port: ${SERVER_PORT:10000}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    
    # Sources enabled
    sources:
      youtube: true
      soundcloud: true
      bandcamp: true
      twitch: true
    
    # Buffer and connection settings
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 30
    isTrace: false
    
    # YouTube specific
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    
    # Auto-update tracks
    autoUpdate: true
    
    # Ratelimit settings (for YouTube)
    ratelimit:
      ipBlocks: []
      excludedIps: []
    
    # Stats (exposed at /v4/stats)
    statsUpdateInterval: 60
    
    # GC settings
    gcInterval: 120

# Spring Boot actuator (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
