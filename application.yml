# Lavalink v4.2.2 Configuration for Render.com
# Docs: https://lavalink.dev/configuration.html

server:
  port: ${SERVER_PORT:10000}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    
    # Disable built-in YouTube source (deprecated)
    # We use the youtube-source plugin instead
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
    
    # Buffer and connection settings
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 30
    isTrace: false
    
    # Ratelimit settings (for YouTube)
    ratelimit:
      ipBlocks: []
      excludedIps: []
    
    # Stats (exposed at /v4/stats)
    statsUpdateInterval: 60
    
    # GC settings
    gcInterval: 120

  # YouTube Source Plugin (replaces deprecated built-in YouTube)
  # https://github.com/lavalink-devs/youtube-source
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

  # YouTube Source Plugin configuration
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients to use for track loading (queried in order)
    # See: https://github.com/lavalink-devs/youtube-source#available-clients
    clients:
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
      - MUSIC
      - TVHTML5_SIMPLY

# Spring Boot actuator (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
